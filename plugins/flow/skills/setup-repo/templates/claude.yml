# Builds issues labelled "claude" and answers @claude on issues and PRs.
name: claude

on:
  issues:
    types: [labeled, assigned]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude:
    if: |
      (github.event_name == 'issues' && github.event.label.name == 'claude') ||
      contains(github.event.comment.body, '@claude') ||
      contains(github.event.review.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: https://github.com/bart-netizen/claude-workflow.git
          plugins: flow@bart-workflow
          additional_permissions: |
            actions: read
          # No prompt on purpose: tag mode reads the issue or comment itself.
          # The "Way of working" rule in CLAUDE.md makes it finish with the ship skill.
