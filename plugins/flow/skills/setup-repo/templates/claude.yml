# Builds issues labelled "claude" and answers @claude on issues and PRs. The logic lives in
# bart-netizen/claude-workflow (reusable workflow); this file says when, and what this repo needs.
# Claude opens its PRs with the Claude App token, so CI and the review start by themselves.
# The other route still works: start Claude Code yourself, it pushes a claude/ branch.
name: claude

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

# The ceiling for the reusable workflow: it cannot get more than this. Its concurrency group
# lives there too; do not add one here, the two would wait on each other.
permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write   # the Claude action mints its App token with this
  actions: read

jobs:
  claude:
    uses: bart-netizen/claude-workflow/.github/workflows/claude.yml@v1
    with:
      # setup-repo: the same language setup and install as ci.yml
      # (python_version: "3.12", python_version_file: .python-version, or node_version_file: .nvmrc).
      python_version_file: .python-version
      install: <INSTALL_CMD>
      # The repo's own check commands, so Claude can run them before the PR.
      allowed_tools: Bash(<TEST_CMD> *),Bash(<LINT_CMD> *)
    secrets:
      # Explicit: `secrets: inherit` does not cross organisations.
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
