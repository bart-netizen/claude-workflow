# Merge to main = deploy to Cloud Run + a smoke test of seconds, not minutes.
# Log analysis happens in check-prod.yml the next morning (only if something was deployed).
name: deploy

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", ".github/**"]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy
        # --source builds in Cloud Build (2,500 free build-minutes/month), not on this runner.
        run: |
          gcloud run deploy "${{ vars.CLOUD_RUN_SERVICE }}" \
            --source . \
            --project "${{ vars.GCP_PROJECT }}" \
            --region "${{ vars.GCP_REGION }}" \
            --quiet
      - name: Smoke test
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "${{ vars.HEALTH_URL }}") && [ "$code" = "200" ] && echo "healthy" && exit 0
            echo "attempt $i: $code"; sleep 10
          done
          echo "::error::Health check failed after deploy. Rollback: revert the merge commit."; exit 1
