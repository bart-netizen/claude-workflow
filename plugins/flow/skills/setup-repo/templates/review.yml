# Independent review once CI is green on a PR. Started by workflow_run (PRs you open) and by
# claude.yml (PRs Claude opens or updates: those runs do not fire workflow_run). The logic lives in bart-netizen/claude-workflow
# (reusable workflow); this file only decides when to call it. Comments only; merging stays with you.
# Re-run by hand: gh workflow run review -f pr=<number>
name: review

on:
  workflow_run:
    # Must equal the `name:` of this repo's CI workflow exactly (e.g. "CI" vs "ci").
    workflows: [ci]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number
        required: true

concurrency:
  group: review-${{ inputs.pr || github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_branch }}
  cancel-in-progress: true

# The ceiling for the reusable workflow: it cannot get more than this.
permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read

jobs:
  review:
    # workflow_run always runs with secrets, also when a PR from a fork triggered CI.
    # Only review branches of this repository, and never main itself.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch != github.event.repository.default_branch)
    uses: bart-netizen/claude-workflow/.github/workflows/review.yml@v1
    with:
      pr: ${{ inputs.pr }}
      head_branch: ${{ github.event.workflow_run.head_branch }}
      # The file name of this repo's CI workflow; the review waits for its run on the PR head.
      ci_workflow_file: ci.yml
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
