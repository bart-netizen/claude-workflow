# Independent review (flow:review) once CI is green on a PR. Comments only; the merge stays with you.
# Re-run by hand: gh workflow run review -f pr=<number>
name: review

on:
  workflow_run:
    # Must equal the `name:` of the CI workflow exactly (e.g. "CI" vs "ci").
    workflows: [ci]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number
        required: true

concurrency:
  group: review-${{ inputs.pr || github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write   # update the sticky review comment
  id-token: write
  actions: read

jobs:
  review:
    # workflow_run always runs with secrets and a write token, also when a PR from a fork
    # triggered CI. Only review branches of this repository.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch != github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Find the PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BR: ${{ github.event.workflow_run.head_branch }}
          IN: ${{ inputs.pr }}
        run: |
          if [ -n "$IN" ]; then n="$IN"
          else n=$(gh pr list -R "$GITHUB_REPOSITORY" --head "$BR" --state open --json number -q '.[0].number // empty'); fi
          echo "number=$n" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.pr.outputs.number != ''
        with:
          ref: refs/pull/${{ steps.pr.outputs.number }}/head
          fetch-depth: 0
      # Claude only reads and writes its review to a file; it has no rights to post.
      # The next step posts it, so a prompt injection in the PR cannot make Claude act on GitHub.
      - uses: anthropics/claude-code-action@v1
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: https://github.com/bart-netizen/claude-workflow.git
          plugins: flow@bart-workflow
          show_full_output: ${{ runner.debug == '1' }}
          prompt: /flow:review ${{ steps.pr.outputs.number }} out=${{ runner.temp }}/flow-review.md
          claude_args: >-
            --model opus
            --allowedTools "Read,Glob,Grep,Write,Bash(gh pr view *),Bash(gh pr diff *),Bash(gh issue view *),Bash(git log *),Bash(git diff *),Bash(git show *)"
      # One comment per PR, updated on every new review instead of piling up.
      - name: Post or update the review comment
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ steps.pr.outputs.number }}
          F: ${{ runner.temp }}/flow-review.md
        run: |
          if [ ! -s "$F" ]; then echo "::warning::No review written."; exit 0; fi
          marker='<!-- flow-review -->'
          body="$(printf '%s\n%s\n\n_Review van commit %s_' "$marker" "$(cat "$F")" "$(git rev-parse --short HEAD)")"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$N/comments" --paginate \
                 --jq "[.[] | select(.body | startswith(\"$marker\"))][0].id // empty")
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" >/dev/null && echo "updated $id"
          else
            gh pr comment "$N" -R "$GITHUB_REPOSITORY" --body "$body"
          fi
